[project]
name = "rul"
version = "0.1.0"
description = "Remaining Useful Life prediction with Physics-Informed Neural Networks and Neuroevolution (N-CMAPSS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "h5py>=3.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
evolution = [
    "pymoo>=0.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rul"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
